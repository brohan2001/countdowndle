name: Bug report
description: File a bug report
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to reproduce"
    validations:
      required: true
  - type: dropdown
    id: which-mode
    attributes:
      label: "Which mode?"
      options:
        - "Daily Countdown"
        - "Duel"
        - "Letters"
        - "Numbers"
        - "Conundrum"
        - "Dictionary checker"
        - "Other"
    validations:
      required: true
  - type: input
    id: browser-and-device
    attributes:
      label: "Browser and device"
  - type: textarea
    id: anything-else
    attributes:
      label: "Anything else (screenshots welcome)"
